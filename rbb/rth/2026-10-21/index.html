<script>
// ── Data paths — edit these to match your setup ───────────────────────────
const BARS_PATH    = '../tmp/keltner_bot_obs/bars_bot1.csv';
const ACTIONS_PATH = '../tmp/keltner_bot_obs/actions_bot1.csv';
const KELTNER_PATH = '../keltner_cross.py';

// Minimum price increment for ES. Used to gap the phantom bar's open 1 tick
// beyond the prior confirmed bar's high/low, matching how the range-bar
// generator opens a new bar after a breakout close (see computePhantomOpen).
const TICK_SIZE = 0.25;

// How far above the bar's high (in price points) the upward zone extends.
const ZONE_PADDING_ABOVE_HIGH = 2.0;
// How far below the bar's low (in price points) the downward zone extends.
const ZONE_PADDING_BELOW_LOW = 2.0;
// How far past the band line itself (upper_band / lower_band) each zone extends.
const ZONE_PADDING_AT_BAND = 0.2;

// ── Display timezone ────────────────────────────────────────────────────
// Bar times from the backend are Unix seconds (UTC). All on-screen time
// display (axis labels, crosshair label, OHLC panel) uses the zone picked
// from the header's time-zone menu (default Sydney), regardless of the
// viewer's browser timezone. Daylight saving follows each zone's rules.
// A change fires a 'displaytzchange' event on window.
const DISPLAY_ZONES = [
  // abbrLocale: the locale whose short zone names cover this zone (AEST, EDT, ...).
  { key: 'sydney', label: 'Sydney', tz: 'Australia/Sydney',    abbrLocale: 'en-AU' },
  { key: 'pt',     label: 'PT',     tz: 'America/Los_Angeles', abbrLocale: 'en-US' },
  { key: 'et',     label: 'ET',     tz: 'America/New_York',    abbrLocale: 'en-US' },
  { key: 'utc',    label: 'UTC',    tz: 'UTC',                 abbrLocale: 'en-US' },
];
const DISPLAY_TZ_KEY = 'chart_display_tz';
let displayZone = DISPLAY_ZONES[0];
try {
  displayZone = DISPLAY_ZONES.find(z => z.key === localStorage.getItem(DISPLAY_TZ_KEY)) || displayZone;
} catch (e) { /* localStorage unavailable — keep the default */ }

const pad2 = n => String(n).padStart(2, '0');
const tzPartFormatters = {};
function tzParts(unixSeconds, tz) {
  const f = tzPartFormatters[tz] || (tzPartFormatters[tz] = new Intl.DateTimeFormat('en-US', {
    timeZone: tz, hourCycle: 'h23', year: 'numeric', month: 'numeric', day: 'numeric',
    hour: 'numeric', minute: 'numeric', second: 'numeric',
  }));
  const p = {};
  for (const { type, value } of f.formatToParts(new Date(unixSeconds * 1000))) p[type] = +value;
  return p;
}
// A Date whose getUTC*() fields read as the wall-clock time in the display zone.
function toDisplayDate(unixSeconds) {
  const p = tzParts(unixSeconds, displayZone.tz);
  return new Date(Date.UTC(p.year, p.month - 1, p.day, p.hour, p.minute, p.second));
}
// Short zone name at that moment, e.g. AEST / AEDT, PDT, EST, UTC.
function displayZoneAbbrev(unixSeconds) {
  if (displayZone.tz === 'UTC') return 'UTC';
  const part = new Intl.DateTimeFormat(displayZone.abbrLocale, { timeZone: displayZone.tz, timeZoneName: 'short' })
    .formatToParts(new Date(unixSeconds * 1000)).find(x => x.type === 'timeZoneName');
  return part ? part.value : displayZone.label;
}
function utcOffsetTickFormatter(time, tickMarkType, locale) {
  const d = toDisplayDate(time);
  switch (tickMarkType) {
    case LightweightCharts.TickMarkType.Year:
      return `${d.getUTCFullYear()}`;
    case LightweightCharts.TickMarkType.Month:
      return `${d.getUTCFullYear()}-${pad2(d.getUTCMonth() + 1)}`;
    case LightweightCharts.TickMarkType.DayOfMonth:
      return `${pad2(d.getUTCMonth() + 1)}-${pad2(d.getUTCDate())}`;
    case LightweightCharts.TickMarkType.TimeWithSeconds:
      return `${pad2(d.getUTCHours())}:${pad2(d.getUTCMinutes())}:${pad2(d.getUTCSeconds())}`;
    case LightweightCharts.TickMarkType.Time:
    default:
      return `${pad2(d.getUTCHours())}:${pad2(d.getUTCMinutes())}`;
  }
}
function utcOffsetCrosshairTimeFormatter(time) {
  const d = toDisplayDate(time);
  return `${pad2(d.getUTCHours())}:${pad2(d.getUTCMinutes())}:${pad2(d.getUTCSeconds())}`;
}

// ── Price chart ───────────────────────────────────────────────────────────
const priceChart = LightweightCharts.createChart(document.getElementById('price-chart'), {
  layout:    { background: { color: '#131722' }, textColor: '#9598a1' },
  grid:      { vertLines: { color: '#2a2e39' }, horzLines: { color: '#2a2e39' } },
  crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
  rightPriceScale: { borderColor: '#2a2e39' },
  timeScale: { borderColor: '#2a2e39', timeVisible: true, secondsVisible: true, tickMarkFormatter: utcOffsetTickFormatter },
  localization: { timeFormatter: utcOffsetCrosshairTimeFormatter },
  handleScroll: { horzTouchDrag: true, vertTouchDrag: false },
  handleScale:  { pinch: true, mouseWheel: true, axisPressedMouseMove: true },
  kineticScroll: { touch: true, mouse: false },
});

// ── BackgroundZonePrimitive ─────────────────────────────────────────────
// Draws solid-to-transparent background rectangles directly on the canvas,
// one per bar, anchored to a price boundary (upper/lower band) and fading
// toward the top or bottom of the pane. This bypasses AreaSeries entirely —
// no whitespace-vs-null ambiguity, no pane- vs region-relative gradients,
// no diagonal line interpolation between bars. Each bar is drawn (or not)
// independently, so a zone appears/disappears on exactly the bar the
// condition is true/false for.
class BackgroundZonePrimitive {
  constructor() {
    this._zones = []; // [{ time, price, direction: 'up' | 'down', color }]
    this._paneViews = [new BackgroundZonePaneView(this)];
    this._chart = undefined;
    this._series = undefined;
    this._requestUpdate = undefined;
  }
  attached({ chart, series, requestUpdate }) {
    this._chart = chart;
    this._series = series;
    this._requestUpdate = requestUpdate;
  }
  detached() {
    this._chart = undefined;
    this._series = undefined;
  }
  updateAllViews() {
    this._paneViews.forEach(pv => pv.update());
  }
  paneViews() {
    return this._paneViews;
  }
  setZones(zones) {
    this._zones = zones;
    if (this._requestUpdate) this._requestUpdate();
  }
  get chart()  { return this._chart; }
  get series() { return this._series; }
  get zones()  { return this._zones; }
}

class BackgroundZonePaneView {
  constructor(source) { this._source = source; }
  update() {} // renderer reads live state from the source each draw, nothing to cache
  renderer() { return new BackgroundZoneRenderer(this._source); }
  zOrder() { return 'bottom'; } // draw beneath the grid/bars
}

class BackgroundZoneRenderer {
  constructor(source) { this._source = source; }
  draw(target) {
    const chart  = this._source.chart;
    const series = this._source.series;
    const zones  = this._source.zones;
    if (!chart || !series || !zones.length) return;

    const timeScale = chart.timeScale();
    const barSpacingMedia = timeScale.options().barSpacing;

    target.useBitmapCoordinateSpace(scope => {
      const ctx = scope.context;
      const hRatio = scope.horizontalPixelRatio;
      const vRatio = scope.verticalPixelRatio;
      const paneTop = 0;
      const paneBottom = scope.bitmapSize.height;
      const halfBar = (barSpacingMedia / 2) * hRatio;

      ctx.save();
      try {
        for (const zone of zones) {
          const xCenterMedia = timeScale.timeToCoordinate(zone.time);
          if (xCenterMedia === null) continue;

          const xCenter = xCenterMedia * hRatio;
          const xLeft = xCenter - halfBar;
          const xRight = xCenter + halfBar;

          if (zone.direction === 'full') {
            ctx.fillStyle = zone.color;
            ctx.fillRect(xLeft, paneTop, xRight - xLeft, paneBottom - paneTop);
            continue;
          }

          const yPriceMedia = series.priceToCoordinate(zone.price);
          if (yPriceMedia === null) continue;
          const yPrice = yPriceMedia * vRatio;

          let yTop, yBottom;
          if (zone.direction === 'up') {
            yBottom = yPrice;
            yTop = paneTop;
            if (zone.boundaryPrice !== undefined) {
              const yBoundaryMedia = series.priceToCoordinate(zone.boundaryPrice);
              if (yBoundaryMedia !== null) yTop = yBoundaryMedia * vRatio;
            }
          } else {
            yTop = yPrice;
            yBottom = paneBottom;
            if (zone.boundaryPrice !== undefined) {
              const yBoundaryMedia = series.priceToCoordinate(zone.boundaryPrice);
              if (yBoundaryMedia !== null) yBottom = yBoundaryMedia * vRatio;
            }
          }
          if (yBottom <= yTop) continue;

          const gradient = ctx.createLinearGradient(0, yTop, 0, yBottom);
          if (zone.direction === 'up') {
            gradient.addColorStop(0, 'transparent'); // pane top: fade out
            gradient.addColorStop(1, zone.color);     // at the line: solid
          } else {
            gradient.addColorStop(0, zone.color);      // at the line: solid
            gradient.addColorStop(1, 'transparent');   // pane bottom: fade out
          }
          ctx.fillStyle = gradient;
          ctx.fillRect(xLeft, yTop, xRight - xLeft, yBottom - yTop);
        }
      } finally {
        ctx.restore();
      }
    });
  }
}

// ── ETH / RTH session background ────────────────────────────────────────
// RTH = 9:30 AM–4:00 PM US Eastern. Determined from each bar's actual
// Eastern wall-clock time (not a fixed UTC offset), so it stays correct
// across DST regardless of the display time zone picked in the header.
const RTH_TIMEZONE = 'America/New_York';
const RTH_START_MIN = 9 * 60 + 30; // 9:30
const RTH_END_MIN = 16 * 60;       // 16:00
const ETH_BACKGROUND_COLOR = 'rgba(255,255,255,0.04)'; // subtle, solid — not faded
// Same violet used for intrabar_watch markers elsewhere in this app — reusing
// it here keeps "in progress / not yet confirmed" a consistent color across
// the chart instead of introducing a second unrelated meaning for a new hue.
const PHANTOM_BAR_COLOR = '#a78bfa';
const rthFormatter = new Intl.DateTimeFormat('en-US', {
  timeZone: RTH_TIMEZONE, hour: '2-digit', minute: '2-digit', hour12: false,
});
function isRTH(unixSeconds) {
  const parts = rthFormatter.formatToParts(new Date(unixSeconds * 1000));
  const hour = parseInt(parts.find(p => p.type === 'hour').value, 10) % 24;
  const minute = parseInt(parts.find(p => p.type === 'minute').value, 10);
  const minutesSinceMidnight = hour * 60 + minute;
  return minutesSinceMidnight >= RTH_START_MIN && minutesSinceMidnight < RTH_END_MIN;
}

const ubSeries = priceChart.addLineSeries({
  color: '#facc15', lineWidth: 1,
  priceLineVisible: false, lastValueVisible: false, crosshairMarkerVisible: false,
});
const lbSeries = priceChart.addLineSeries({
  color: '#f97316', lineWidth: 1,
  priceLineVisible: false, lastValueVisible: false, crosshairMarkerVisible: false,
});
const emaSeries = priceChart.addLineSeries({
  color: '#2563EB', lineWidth: 1,
  priceLineVisible: false, lastValueVisible: false, crosshairMarkerVisible: false,
});

const barSeries = priceChart.addBarSeries({
  upColor: '#60A5FA', downColor: '#60A5FA', openVisible: true,
});

// Dedicated series for the forming (unconfirmed) bar — kept separate from
// barSeries on purpose. barSeries.update() can only append-or-replace the
// series' own *last* point; once a real bar closes at its own true
// timestamp (later than the phantom's synthetic slot), that update would
// just append a new point alongside the stale phantom instead of removing
// it, leaving a permanent ghost candle. Since a series holding zero points
// contributes nothing to the chart's shared time axis, clearing this
// series with setData([]) makes the old phantom's column disappear
// entirely — not just blank out its values — with no leftover artifact
// and no gap column.
const phantomSeries = priceChart.addBarSeries({
  upColor: PHANTOM_BAR_COLOR, downColor: PHANTOM_BAR_COLOR, openVisible: true,
  lastValueVisible: false, priceLineVisible: false,
});

const zonePrimitive = new BackgroundZonePrimitive();
barSeries.attachPrimitive(zonePrimitive);

// ── Live tick price line ─────────────────────────────────────────────────
// Independent of the bar data's own (built-in) last-value line: this one
// tracks raw ticks streamed from /api/last-tick-stream via SSE, so it can
// move between bar closes instead of jumping only when a bar finalizes.
// Starts hidden (price 0, not visible) until the first tick arrives.
const liveTickLine = barSeries.createPriceLine({
  price: 0,
  color: '#a78bfa',
  lineWidth: 1,
  lineStyle: LightweightCharts.LineStyle.Dashed,
  axisLabelVisible: false,
  title: 'live',
});
let liveTickLineShown = false;

// ── Phantom bar (Tier 1: approximate) ───────────────────────────────────
// Renders the range bar currently forming, using only last_tick() — i.e.
// open (last confirmed bar's close) vs. current price, with high/low
// accumulated as a running max/min across every tick this browser tab has
// actually observed since the bar opened (reset when the next real bar
// closes). That keeps the stem from contracting as price pulls back toward
// open — but it still can't see ticks that happened before this tab
// connected, or any excursion that occurred between two SSE polls faster
// than the poll interval. A faithful version needs the bot to expose its
// own running high/low for the in-progress bar — not available yet, see
// chat history for Tier 2.
let lastConfirmedBar = null;   // { time, open, high, low, close, volume } of latest real bar
let phantomBarTime   = null;   // synthetic time slot the phantom bar occupies until the next real bar replaces it
let lastTickPrice    = null;   // most recent price from the tick stream, so a fresh loadChartData() can redraw the phantom immediately instead of waiting for the next tick
let phantomHigh       = null;  // running max of every tick actually observed since the phantom bar opened
let phantomLow        = null;  // running min, same idea — these only ever widen (reset happens on the next real bar), so the stem no longer contracts as price pulls back toward open

// A range bar can only close when price has traveled the full range from
// its origin — so by construction its close price IS the high (upside
// breakout close) or IS the low (downside breakout close). The next bar
// opens 1 tick beyond whichever extreme was just hit, since price has
// already traded through that level.
function computePhantomOpen(bar) {
  if (bar.close >= bar.high) return +(bar.high + TICK_SIZE).toFixed(2);
  if (bar.close <= bar.low)  return +(bar.low  - TICK_SIZE).toFixed(2);
  return bar.close; // shouldn't happen for a true range bar; fallback just in case
}

function updatePhantomBar(price) {
  if (!lastConfirmedBar || phantomBarTime == null || price == null) return;
  const open = computePhantomOpen(lastConfirmedBar);
  // Seed high/low with `open` too, not just the live price — open can sit
  // outside [phantomLow, phantomHigh] now that it's gapped beyond the prior
  // bar's extreme, and leaving it out would let a bar's open print above its
  // own high (or below its own low) on the very first tick.
  phantomHigh = Math.max(phantomHigh, price, open);
  phantomLow  = Math.min(phantomLow, price, open);
  phantomSeries.update({ time: phantomBarTime, open, high: phantomHigh, low: phantomLow, close: price });
}

// Removes the forming-bar placeholder entirely (not just blanking its
// values) so it never lingers as a stray candle once the real bar that
// replaces it has been drawn. Safe to call even when there's nothing to
// clear (e.g. the very first load).
function clearPhantomBar() {
  phantomSeries.setData([]);
}

// ── Auto-scroll on new bar ──────────────────────────────────────────────
// When a bar closes, nudge the visible window left by however many columns
// were just added (normally 1: the new real bar, with the phantom re-seeded
// one slot further right). Net effect: every bar on screen slides left by
// exactly one bar width, the newest bars stay at the same screen position,
// and your zoom level is untouched.
//
// AUTO_SCROLL_ONLY_AT_LIVE_EDGE: when true, the nudge only happens while the
// most recent bar is on screen — if you've panned back to study history,
// the view stays put instead of drifting. Set false to always nudge.
const AUTO_SCROLL_ON_NEW_BAR        = true;
const AUTO_SCROLL_ONLY_AT_LIVE_EDGE = true;

// Total columns on the shared time axis. The line series share the bar
// series' timestamps, so the only extra column is the phantom bar's slot.
function timeAxisColumnCount() {
  return barSeries.data().length + phantomSeries.data().length;
}

// Snapshot the view *before* touching any series, so the library's own
// right-edge handling during update()/setData() can't skew the result.
function captureScrollState() {
  if (!AUTO_SCROLL_ON_NEW_BAR) return null;
  const range = priceChart.timeScale().getVisibleLogicalRange();
  if (!range) return null;
  const columns = timeAxisColumnCount();
  const atLiveEdge = range.to >= columns - 1; // latest column visible
  if (AUTO_SCROLL_ONLY_AT_LIVE_EDGE && !atLiveEdge) return null;
  return { range, columns };
}

// Re-apply the pre-update window shifted by the number of columns added.
// setVisibleLogicalRange on priceChart propagates to volChart through the
// existing logical-range sync subscription.
function applyScrollShift(state) {
  if (!state) return;
  const added = timeAxisColumnCount() - state.columns;
  if (added <= 0) return;
  priceChart.timeScale().setVisibleLogicalRange({
    from: state.range.from + added,
    to:   state.range.to   + added,
  });
}

  crosshair: { mode: LightweightCharts.CrosshairMode.Normal },

  timeScale: { borderColor: '#2a2e39', visible: false },

// ── Persist viewport (visible time range) across reloads ───────────────────
// Time-based rather than logical/index-based: bar count can change between
// loads (new bars appended), which would make a saved logical range point at
// the wrong slice of data. A time window stays meaningful regardless.
const VIEWPORT_KEY = 'esu6_chart_viewport';
let viewportSaveTimer = null;

function saveViewport(range) {
  if (!range) return;
  clearTimeout(viewportSaveTimer);
  viewportSaveTimer = setTimeout(() => {
    try {
      localStorage.setItem(VIEWPORT_KEY, JSON.stringify({ from: range.from, to: range.to }));
    } catch (e) {
      // localStorage unavailable (private mode, quota, etc.) — fail silently
    }
  }, 300);
}

priceChart.timeScale().subscribeVisibleTimeRangeChange(saveViewport);

function restoreViewport() {
  let saved = null;
  try {
    saved = JSON.parse(localStorage.getItem(VIEWPORT_KEY));
  } catch (e) {
    saved = null;
  }
  if (saved && saved.from != null && saved.to != null) {
    try {
      priceChart.timeScale().setVisibleRange(saved);
      return true;
    } catch (e) {
      // Saved range doesn't fall within the freshly loaded data — fall back below
    }
  }
  return false;
}

// ── Open on the most recent bar ───────────────────────────────────────────
// On page load, anchor the right edge of the view to the newest bar (plus
// the phantom slot) instead of wherever the view was last left. The zoom
// level (number of bars across the screen) is still taken from the saved
// viewport if there is one; otherwise DEFAULT_VISIBLE_BARS is used.
const DEFAULT_VISIBLE_BARS = 120;
const RIGHT_MARGIN_BARS    = 3;   // empty space to the right of the newest bar

function showLatestBars() {
  const columns = timeAxisColumnCount();
  if (!columns) return;
  let span = DEFAULT_VISIBLE_BARS;
  if (restoreViewport()) {
    const r = priceChart.timeScale().getVisibleLogicalRange();
    if (r && r.to > r.from) span = r.to - r.from;
  }
  const to = columns - 1 + RIGHT_MARGIN_BARS;
  priceChart.timeScale().setVisibleLogicalRange({ from: to - span, to });
}

priceChart.subscribeCrosshairMove(param => {

});

// ── OHLC hover display ────────────────────────────────────────────────────
let ubMap = {}, lbMap = {}, emaMap = {}, volMap = {};
// Running client-side copies of everything that lightweight-charts can only
// accept as a full array (setMarkers/setZones have no incremental variant).
// Appending to these and re-calling setMarkers/setZones is still cheap and
// network-free — the expensive part we're avoiding is the /api/chart-data
// round trip and the setData() calls on the price/vol/line series.
let allMarkers = [];
let zones = [];

// ── Zone colours ─────────────────────────────────────────────────────────
// Every EMA-beyond-band zone gets a light (translucent) tint by default:
// light yellow above the upper band, light orange below the lower band.
// If the same bar also carries an XC std-dev circle marker, the zone is
// recoloured at full strength:
//   green circle (xc_positive > +1 SD) → yellow
//   red circle   (xc_positive < -1 SD) → orange
// The circle colours must match XC_UP_COLOR / XC_DN_COLOR in
// chart_markers.py (and the inline copy in app.py's build_chart_data).
const ZONE_LIGHT_UP_COLOR = 'rgba(250,204,21,0.35)'; // light yellow (#facc15 at 35%)
const ZONE_LIGHT_DN_COLOR = 'rgba(249,115,22,0.35)'; // light orange (#f97316 at 35%)
const ZONE_XC_UP_COLOR   = '#facc15'; // yellow
const ZONE_XC_DN_COLOR   = '#f97316'; // orange
const XC_UP_MARKER_COLOR = '#22c55e';
const XC_DN_MARKER_COLOR = '#ef4444';

// time -> 'up' | 'down' for bars that carry an XC circle marker. Matched on
// shape + colour so entry arrows, exit squares and violet intrabar_watch
// circles on the same bar are ignored.
function xcMarkerDirection(marker) {
  if (!marker || marker.shape !== 'circle') return null;
  const c = String(marker.color || '').toLowerCase();
  if (c === XC_UP_MARKER_COLOR) return 'up';
  if (c === XC_DN_MARKER_COLOR) return 'down';
  return null;
}
function buildXcMap(markers) {
  const map = {};
  for (const m of markers || []) {
    const dir = xcMarkerDirection(m);
    if (dir) map[m.time] = dir;
  }
  return map;
}
let xcMap = {};

function zoneColorFor(time, direction) {
  const xc = xcMap[time];
  if (xc === 'up')   return ZONE_XC_UP_COLOR;
  if (xc === 'down') return ZONE_XC_DN_COLOR;
  return direction === 'up' ? ZONE_LIGHT_UP_COLOR : ZONE_LIGHT_DN_COLOR;
}

// Same zone rules used by the full loadChartData() pass below, factored out
// so a single incoming bar (applyNewBar) can compute its own zone entries
// without re-deriving them for the whole series. Reads xcMap, so xcMap must
// be up to date for this bar before calling.
function zoneEntriesForBar(bar, emaVal, ubVal, lbVal) {
  const entries = [];
  if (!isRTH(bar.time)) {
    entries.push({ time: bar.time, direction: 'full', color: ETH_BACKGROUND_COLOR });
  }
  if (emaVal !== undefined && lbVal !== undefined && emaVal < lbVal) {
    const boundaryPrice = bar.low - ZONE_PADDING_BELOW_LOW;
    entries.push({ time: bar.time, price: lbVal - ZONE_PADDING_AT_BAND, boundaryPrice, direction: 'down', color: zoneColorFor(bar.time, 'down') });
  }
  if (emaVal !== undefined && ubVal !== undefined && emaVal > ubVal) {
    const boundaryPrice = bar.high + ZONE_PADDING_ABOVE_HIGH;
    entries.push({ time: bar.time, price: ubVal + ZONE_PADDING_AT_BAND, boundaryPrice, direction: 'up', color: zoneColorFor(bar.time, 'up') });
  }
  return entries;
}

// ── Time-zone menu ──────────────────────────────────────────────────────
const tzBtn  = document.getElementById('tz-btn');
const tzMenu = document.getElementById('tz-menu');
let lastCrosshairTime = null;
function renderTzMenu() {
  tzBtn.innerHTML = `${displayZone.label} &#9662;`;
  tzMenu.innerHTML = DISPLAY_ZONES.map(z =>
    `<li role="option" tabindex="-1" data-key="${z.key}" aria-selected="${z === displayZone}">` +
    `<span class="tick">${z === displayZone ? '&#10003;' : ''}</span>${z.label}` +
    `<span class="zone">${z.tz}</span></li>`
  ).join('');
}
function setTzMenuOpen(open) {
  tzMenu.classList.toggle('open', open);
  tzBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
  if (!open) return;
  // Open leftward from the button if it would run off the right edge (phones).
  tzMenu.style.left = ''; tzMenu.style.right = '';
  if (tzMenu.getBoundingClientRect().right > window.innerWidth - 4) {
    tzMenu.style.left = 'auto'; tzMenu.style.right = '0';
  }
  (tzMenu.querySelector('[aria-selected="true"]') || tzMenu.firstElementChild).focus();
}
function setDisplayZone(key) {
  const z = DISPLAY_ZONES.find(z => z.key === key);
  if (!z) return;
  displayZone = z;
  try { localStorage.setItem(DISPLAY_TZ_KEY, z.key); } catch (e) { /* ignore */ }
  renderTzMenu();
  // New function objects so the chart re-labels its axis and crosshair.
  priceChart.applyOptions({
    timeScale:    { tickMarkFormatter: (...a) => utcOffsetTickFormatter(...a) },
    localization: { timeFormatter: t => utcOffsetCrosshairTimeFormatter(t) },
  });
  if (lastCrosshairTime) document.getElementById('d-time').textContent = fmtTime(lastCrosshairTime);
  window.dispatchEvent(new CustomEvent('displaytzchange', { detail: z }));
}
tzBtn.addEventListener('click', e => {
  e.stopPropagation();
  setTzMenuOpen(!tzMenu.classList.contains('open'));
});
tzMenu.addEventListener('click', e => {
  const li = e.target.closest('li');
  if (!li) return;
  setDisplayZone(li.dataset.key);
  setTzMenuOpen(false);
  tzBtn.focus();
});
tzMenu.addEventListener('keydown', e => {
  const items = [...tzMenu.children];
  const i = items.indexOf(document.activeElement);
  if (e.key === 'ArrowDown') { e.preventDefault(); items[(i + 1) % items.length].focus(); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); items[(i - 1 + items.length) % items.length].focus(); }
  else if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); if (i >= 0) items[i].click(); }
  else if (e.key === 'Escape') { setTzMenuOpen(false); tzBtn.focus(); }
});
document.addEventListener('click', e => {
  if (!e.target.closest('#tz-wrap')) setTzMenuOpen(false);
});
renderTzMenu();

function fmt(v)     { return (v !== undefined && v !== null) ? Number(v).toFixed(2) : '-'; }
function fmtTime(t) {
  if (!t) return '';
  const d = toDisplayDate(t);
  return `${d.getUTCFullYear()}-${pad2(d.getUTCMonth() + 1)}-${pad2(d.getUTCDate())} ${pad2(d.getUTCHours())}:${pad2(d.getUTCMinutes())}:${pad2(d.getUTCSeconds())} ${displayZoneAbbrev(t)}`;
}

    document.getElementById('d-ub').textContent    = fmt(ubMap[param.time]);
    document.getElementById('d-lb').textContent    = fmt(lbMap[param.time]);
    document.getElementById('d-vol').textContent   = volMap[param.time] ? volMap[param.time].toLocaleString() : '-';
    document.getElementById('d-time').textContent  = fmtTime(param.time);

});

// ── Resize ────────────────────────────────────────────────────────────────

const volumeEl = document.getElementById('volume-chart');

// User-driven show/hide, independent of (and overriding) the viewport-based

const VOL_HIDDEN_KEY = 'esu6_vol_hidden';
let volHiddenByUser = true;

// ---------------------------------------------------------------------------
// New-bar sounds
// ---------------------------------------------------------------------------
// Browsers block audio until the page has had a click/tap/keypress, so the
// AudioContext is created (or resumed) on the first interaction. Until then
// playBarSound() is a silent no-op. Clicking the Sound button also counts.
//
// Sounds (generated with Web Audio, no files needed):
//   - every confirmed bar: short soft tick
//   - bar carrying a buy marker: higher, longer two-note rise
//   - bar carrying a sell marker: lower, longer two-note fall
// Plain ticks are throttled so fast 16-tick bars don't pile up; trigger
// sounds are never throttled.
const SOUND_MUTED_KEY    = 'chart_sound_muted';
const BAR_SOUND_MIN_GAP  = 150; // ms between plain bar ticks
let soundMuted = false;
try { soundMuted = localStorage.getItem(SOUND_MUTED_KEY) === '1'; } catch (e) { /* ignore */ }

let audioCtx = null;
let lastBarSoundAt = 0;

function unlockAudio() {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
  } catch (e) {
    console.warn('Audio unavailable:', e);
  }
}
['click', 'touchstart', 'keydown'].forEach(ev =>
  document.addEventListener(ev, unlockAudio, { once: true, capture: true }));

function beep(freq, duration, startOffset = 0, volume = 0.15) {
  const t0   = audioCtx.currentTime + startOffset;
  const osc  = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'sine';
  osc.frequency.value = freq;
  gain.gain.setValueAtTime(volume, t0);
  gain.gain.exponentialRampToValueAtTime(0.001, t0 + duration);
  osc.connect(gain).connect(audioCtx.destination);
  osc.start(t0);
  osc.stop(t0 + duration);
}

// Works out whether a marker is a buy or sell trigger. Accepts the usual
// lightweight-charts marker fields (text / shape / position); anything it
// can't classify (e.g. intrabar_watch markers) returns null.
function markerDirection(marker) {
  if (!marker) return null;
  const text = String(marker.text || '').trim().toUpperCase();
  if (text.startsWith('B')) return 'buy';
  if (text.startsWith('S')) return 'sell';
  if (marker.shape === 'arrowUp')   return 'buy';
  if (marker.shape === 'arrowDown') return 'sell';
  return null;
}

function playBarSound(marker) {
  if (soundMuted || !audioCtx || audioCtx.state !== 'running') return;
  const dir = markerDirection(marker);
  if (dir === 'buy')  { beep(880, 0.15, 0, 0.2);  beep(1320, 0.25, 0.12, 0.2); return; }
  if (dir === 'sell') { beep(660, 0.15, 0, 0.2);  beep(440,  0.25, 0.12, 0.2); return; }
  const now = performance.now();
  if (now - lastBarSoundAt < BAR_SOUND_MIN_GAP) return;
  lastBarSoundAt = now;
  beep(880, 0.06, 0, 0.1);
}

const soundToggleBtn = document.getElementById('sound-toggle-btn');
function updateSoundToggleBtn() {
  soundToggleBtn.classList.toggle('active', !soundMuted);
  soundToggleBtn.textContent = soundMuted ? 'Muted' : 'Sound';
}
soundToggleBtn.addEventListener('click', () => {
  soundMuted = !soundMuted;
  try { localStorage.setItem(SOUND_MUTED_KEY, soundMuted ? '1' : '0'); } catch (e) { /* ignore */ }
  updateSoundToggleBtn();
  unlockAudio();
  if (!soundMuted && audioCtx) beep(880, 0.06, 0, 0.1); // confirm it's working
});
updateSoundToggleBtn();

function resize() {
  const total = document.getElementById('chart-container').clientHeight;

  let volShare;
  if (total < 260) {
    volShare = 0;               // too short to show both panes usefully
  } else if (total < 420) {
    volShare = 0.14;            // short viewport: keep volume as a thin strip
  } else {
    volShare = 0.22;            // normal desktop/tablet split
  }

  const showVol = volShare > 0 && !volHiddenByUser;
  volumeEl.style.display = showVol ? '' : 'none';

  const vh = showVol ? Math.floor(total * volShare) : 0;
  const ph = total - vh - (showVol ? 1 : 0); // -1px for the border-top on volume pane

  document.getElementById('price-chart').style.height = ph + 'px';
  volumeEl.style.height = vh + 'px';
  priceChart.applyOptions({ width: document.getElementById('price-chart').clientWidth, height: ph });
  if (showVol) {
    volChart.applyOptions({ width: volumeEl.clientWidth, height: vh });
  }
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 100));
resize();

// ── Load data from Flask API ──────────────────────────────────────────────
async function loadChartData(scrollState = null) {
  const overlay    = document.getElementById('overlay');
  const overlayMsg = document.getElementById('overlay-msg');
  const overlayErr = document.getElementById('overlay-err');
  const spinner    = document.getElementById('spinner');

  const params = new URLSearchParams({
    bars:    BARS_PATH,
    actions: ACTIONS_PATH,
    keltner: KELTNER_PATH,
  });

  try {
    const res  = await fetch('/api/chart-data?' + params);
    const data = await res.json();

    if (!res.ok) {
      throw new Error(data.error || 'HTTP ' + res.status);
    }

    const { bars, volume, upper_band, lower_band, ema8_data, markers, trade_lines } = data;

    // Lookup maps for crosshair display
    ubMap  = Object.fromEntries(upper_band.map(d => [d.time, d.value]));
    lbMap  = Object.fromEntries(lower_band.map(d => [d.time, d.value]));
    emaMap = Object.fromEntries(ema8_data.map(d  => [d.time, d.value]));
    volMap = Object.fromEntries(volume.map(d     => [d.time, d.value]));

    // ── Background zones (EMA vs Keltner bands) ────────────────────────────
    // Each bar is evaluated independently: a zone exists only for the exact
    // bar where the condition holds, so it appears/disappears on that bar
    // with no persistence into neighboring bars. Uses the same per-bar rule
    // (zoneEntriesForBar) that applyNewBar() uses for incremental updates,
    // so a full reload and an incremental append can never disagree.
    xcMap = buildXcMap(markers);  // must precede zone build (zone colour depends on it)
    zones = bars.flatMap(b => zoneEntriesForBar(b, emaMap[b.time], ubMap[b.time], lbMap[b.time]));
    zonePrimitive.setZones(zones);

    // Populate all series
    ubSeries.setData(upper_band);
    lbSeries.setData(lower_band);
    emaSeries.setData(ema8_data);
    barSeries.setData(bars);
    // XC circles are hidden: they only colour the zones (via xcMap above).
    allMarkers = markers.filter(m => !xcMarkerDirection(m));
    barSeries.setMarkers(allMarkers);
    // Per-point `color` on HistogramData overrides the series' own `color` option,
    // so strip it here to force the flat volSeries color from above to apply.
    volSeries.setData(volume.map(d => ({ time: d.time, value: d.value })));

    // barSeries.setData() above only replaces barSeries's own points — the
    // phantom lives on its own separate series now (see phantomSeries above)
    // specifically so it doesn't get silently duplicated or left stranded
    // here. Clear it explicitly, then re-establish the phantom slot for
    // whatever bar is forming next and redraw it immediately if we already
    // have a price (don't wait for the next tick — ticks can be seconds apart).
    clearPhantomBar();
    lastConfirmedBar = bars.length ? bars[bars.length - 1] : null;
    phantomBarTime    = lastConfirmedBar ? lastConfirmedBar.time + 1 : null;
    const seedOpen    = lastConfirmedBar ? computePhantomOpen(lastConfirmedBar) : null;
    phantomHigh       = seedOpen;
    phantomLow        = seedOpen;
    updatePhantomBar(lastTickPrice);

    // Restore the last viewport if we have one and it's still valid for this
    // data; otherwise fall back to fitting all content (e.g. first-ever load).
    // Note: restoring on priceChart alone is enough — the logical-range sync
    // subscription above propagates it to volChart automatically.
    if (scrollState) {
      // Live refresh after a new bar (fallback path): keep the current
      // window and nudge it left instead of restoring the saved viewport.
      applyScrollShift(scrollState);
    } else {
      showLatestBars();
    }

    overlay.classList.add('hidden');

  } catch (err) {
    spinner.style.display    = 'none';
    overlayMsg.style.display = 'none';
    overlayErr.style.display = 'block';
    overlayErr.textContent   = 'Error loading chart data: ' + err.message;
    console.error(err);
  }
}

loadChartData();

// ── Live tick stream (SSE) ──────────────────────────────────────────────
// Pushes /api/last-tick-stream into the liveTickLine + header badge created
// above. Independent of loadChartData()'s periodic full-refresh polling —
// this connection stays open and the browser's EventSource auto-reconnects
// on drop, so there's no manual retry/backoff logic needed here.
const liveDot  = document.getElementById('live-dot');
const liveText = document.getElementById('d-live');

function setLiveStatus(state, label) {
  // state: 'connecting' | 'live' | 'stale' | 'error'
  const colors = { connecting: '#555', live: '#26a69a', stale: '#eab308', error: '#ef5350' };
  liveDot.style.background = colors[state] || '#555';
  liveText.textContent = label;
}

setLiveStatus('connecting', '-');

const liveTickSource = new EventSource(
  '/api/last-tick-stream?' + new URLSearchParams({ bars: BARS_PATH })
);

liveTickSource.onopen = () => {
  setLiveStatus('connecting', '-');
};

liveTickSource.onmessage = (evt) => {
  let record;
  try {
    record = JSON.parse(evt.data);
  } catch (err) {
    console.error('last-tick-stream: bad payload', err, evt.data);
    return;
  }
  if (record && record.price != null) {
    liveTickLine.applyOptions({ price: record.price });
    liveTickLineShown = true;
    setLiveStatus('live', fmt(record.price));
    lastTickPrice = record.price;
    updatePhantomBar(record.price);
  }
};

liveTickSource.addEventListener('no_data', () => {
  setLiveStatus('stale', 'no data');
});

// Appends one closed bar to every series with series.update() instead of
// re-fetching /api/chart-data and calling setData() on everything. update()
// either appends (time > last point's time) or replaces the last point
// (time === last point's time) — it can't touch anything earlier than that,
// which is exactly the "don't refresh the view" behavior we want: the pan/
// zoom position is never disturbed because the series is never wiped.
function applyNewBar(d) {
  const { bar, volume, ema8, upper_band, lower_band, marker } = d;
  const scrollState = captureScrollState();

  barSeries.update(bar);
  if (volume) volSeries.update(volume);
  if (ema8 !== undefined)       emaSeries.update({ time: bar.time, value: ema8 });
  if (upper_band !== undefined) ubSeries.update({ time: bar.time, value: upper_band });
  if (lower_band !== undefined) lbSeries.update({ time: bar.time, value: lower_band });

  // Keep the crosshair lookup maps in sync so hovering this bar works
  // without a reload.
  if (ema8 !== undefined)       emaMap[bar.time] = ema8;
  if (upper_band !== undefined) ubMap[bar.time]  = upper_band;
  if (lower_band !== undefined) lbMap[bar.time]  = lower_band;
  if (volume)                   volMap[bar.time] = volume.value;

  // setMarkers/setZones have no incremental variant — but appending to the
  // arrays we already hold client-side and re-calling them is just local
  // array work, no network round trip, so it's still "free" here.
  if (marker) {
    const xcDir = xcMarkerDirection(marker);
    if (xcDir) {
      xcMap[marker.time] = xcDir;  // XC circles are hidden; they only colour zones
    } else {
      allMarkers.push(marker);
      barSeries.setMarkers(allMarkers);
    }
  }
  const newZones = zoneEntriesForBar(bar, ema8, upper_band, lower_band);
  if (newZones.length) {
    zones.push(...newZones);
    zonePrimitive.setZones(zones);
  }

  // Re-seed the phantom bar slot for whatever forms next, same as the full
  // reload path does after setData(). Clear the old phantom point first —
  // phantomSeries.update() below would otherwise just append a new point
  // at the new synthetic time next to the stale one, since they're
  // different time keys on the same series.
  clearPhantomBar();
  lastConfirmedBar = bar;
  phantomBarTime    = bar.time + 1;
  const seedOpen    = computePhantomOpen(lastConfirmedBar);
  phantomHigh       = seedOpen;
  phantomLow        = seedOpen;
  updatePhantomBar(lastTickPrice);

  applyScrollShift(scrollState);
}

liveTickSource.addEventListener('new_bar', (evt) => {
  // Preferred path: the backend includes the closed bar's data in the SSE
  // payload, so we can append it in place with applyNewBar() below — no
  // /api/chart-data round trip, no setData() on any series, viewport
  // untouched.
  //
  // Fallback: if this fires as a bare event (evt.data empty, or the backend
  // hasn't been updated to include the payload yet — see chat for the
  // required `new_bar` SSE payload shape), fall back to the old full
  // re-fetch-and-setData() refresh so nothing breaks.
  if (evt.data) {
    try {
      const d = JSON.parse(evt.data);
      if (d && d.bar) {
        applyNewBar(d);
        playBarSound(d.marker);
        return;
      }
    } catch (err) {
      console.error('new_bar: bad payload, falling back to full reload', err, evt.data);
    }
  }
  playBarSound(null); // fallback path has no marker info, plain tick only
  loadChartData(captureScrollState());
});

liveTickSource.addEventListener('error', (evt) => {
  // Fires both for our named "error" SSE events (backend read_last_tick
  // threw) and for the browser's own connection-level errors — evt.data
  // is only present in the former case.
  if (evt.data) {
    try {
      const payload = JSON.parse(evt.data);
      console.error('last-tick-stream: backend error', payload.error);
    } catch { /* ignore parse failure on malformed error payload */ }
  }
  setLiveStatus('error', 'error');
});

</script>

  const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

  function summary(ts) {

  function indexOf(time) {

})();

  const when = sec => {

      totCells.push(num(d));
    }
    list.innerHTML = row('hd', hd) + body.join('') + row('tot', totCells);
  }
  render();
  window.addEventListener('displaytzchange', render);
  list.addEventListener('click', ev => {
    const el = ev.target.closest('.cmp-row[data-i]');
